<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Task Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f7f9;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #5b6b7a;
    --line: #d5dde4;
    --accent: #0b5f7a;
    --accent-dark: #084a5f;
    --pending-bg: #fdeccf;
    --pending-fg: #7a4a00;
    --progress-bg: #d6e8f5;
    --progress-fg: #0d4a73;
    --done-bg: #d7efdf;
    --done-fg: #1c5a34;
    --error: #a32020;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  header {
    background: var(--ink);
    color: #fff;
    padding: 28px 24px;
  }

  header div {
    max-width: 1080px;
    margin: 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 4px 0 0;
    color: #b9c6d2;
    max-width: 60ch;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 56px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
    align-items: start;
  }

  h2 {
    margin: 0 0 16px;
    font-size: 1.125rem;
    font-weight: 600;
  }

  form, .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 24px;
  }

  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid #aebbc7;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid #7fc0d6;
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { background: var(--accent-dark); }
  button:disabled { background: #8fa3af; cursor: not-allowed; }

  .message {
    margin: 16px 0 0;
    font-size: 0.9375rem;
    min-height: 1.4em;
  }

  .message.ok { color: var(--done-fg); }
  .message.fail { color: var(--error); }

  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .list-head h2 { margin: 0; }
  .count { color: var(--muted); font-size: 0.9375rem; }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 460px;
  }

  th, td {
    text-align: left;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
  }

  th {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
  }

  td.id { color: var(--muted); width: 48px; }
  td.name { font-weight: 500; }

  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .pill.pending { background: var(--pending-bg); color: var(--pending-fg); }
  .pill.progress { background: var(--progress-bg); color: var(--progress-fg); }
  .pill.done { background: var(--done-bg); color: var(--done-fg); }
  .pill.other { background: #e6ebef; color: var(--ink); }

  .empty {
    padding: 24px 8px;
    color: var(--muted);
  }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; padding: 24px 16px 40px; }
    header { padding: 22px 16px; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Employee Task Management</h1>
      <p>Track who is working on what, and add new tasks as they come in.</p>
    </div>
  </header>

  <main>
    <section>
      <form id="task-form" novalidate>
        <h2>Add a task</h2>

        <label for="id">Task ID</label>
        <input type="number" id="id" name="id" min="1" required>

        <label for="taskName">Task name</label>
        <input type="text" id="taskName" name="taskName" required>

        <label for="assignedTo">Assigned to</label>
        <input type="text" id="assignedTo" name="assignedTo" required>

        <label for="status">Status</label>
        <select id="status" name="status" required>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <button type="submit" id="submit-btn">Add task</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="list">
      <div class="list-head">
        <h2>All tasks</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Task</th>
              <th>Assigned to</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="task-body"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>No tasks yet. Add the first one using the form.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('task-form');
    const body = document.getElementById('task-body');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const idInput = document.getElementById('id');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    function pillClass(status) {
      const s = String(status).toLowerCase();
      if (s === 'pending') return 'pending';
      if (s === 'in progress') return 'progress';
      if (s === 'completed') return 'done';
      return 'other';
    }

    function cell(text, className) {
      const td = document.createElement('td');
      if (className) td.className = className;
      td.textContent = text;
      return td;
    }

    function render(tasks) {
      body.innerHTML = '';

      tasks.forEach((task) => {
        const tr = document.createElement('tr');
        tr.appendChild(cell(task.id, 'id'));
        tr.appendChild(cell(task.taskName, 'name'));
        tr.appendChild(cell(task.assignedTo));

        const statusCell = document.createElement('td');
        const pill = document.createElement('span');
        pill.className = 'pill ' + pillClass(task.status);
        pill.textContent = task.status;
        statusCell.appendChild(pill);
        tr.appendChild(statusCell);

        body.appendChild(tr);
      });

      empty.hidden = tasks.length > 0;
      count.textContent = tasks.length + (tasks.length === 1 ? ' task' : ' tasks');

      const maxId = tasks.reduce((max, t) => Math.max(max, Number(t.id) || 0), 0);
      idInput.value = maxId + 1;
    }

    async function loadTasks() {
      try {
        const res = await fetch('/tasks');
        if (!res.ok) throw new Error('Request failed');
        render(await res.json());
      } catch (err) {
        showMessage('Could not load tasks. Check that the server is running.', 'fail');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showMessage('', '');

      const payload = {
        id: idInput.value.trim(),
        taskName: document.getElementById('taskName').value.trim(),
        assignedTo: document.getElementById('assignedTo').value.trim(),
        status: document.getElementById('status').value
      };

      if (!payload.id || !payload.taskName || !payload.assignedTo) {
        showMessage('Fill in the task ID, task name and assignee.', 'fail');
        return;
      }

      submitBtn.disabled = true;

      try {
        const res = await fetch('/add-task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          showMessage(data.message || 'The task could not be added.', 'fail');
        } else {
          showMessage(data.message, 'ok');
          form.reset();
          await loadTasks();
        }
      } catch (err) {
        showMessage('Could not reach the server. Check that it is running.', 'fail');
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadTasks();
  </script>
</body>
</html>
